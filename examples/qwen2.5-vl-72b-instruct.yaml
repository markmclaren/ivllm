metadata:
    target: Isambard-AI GH200
    created-by: Antigravity
    version: 0.1.0
    lifecycle: experimental
min-vllm-version: "0.19.1"
idle-timeout: 60

# vLLM config for Qwen/Qwen2.5-VL-72B-Instruct on Isambard AI
#
# Hardware: 4 × GH200 120GB per node (Isambard AI Phase 1/2) — ~96 GiB usable HBM3e per GPU (~384 GB total)
# Model: ~72.7B dense transformer LLM + ~675M ViT vision encoder (~73.4B total parameters), ~147 GB at bfloat16
# Parallelism: tp=4 across all 4 GPUs on a single node (~36.7 GB weights per GPU)
# KV Cache: Leaves ~49.7 GB VRAM per GPU (~198 GB total) for KV cache, easily supporting full 128K context
# Multimodal: mm-encoder-tp-mode data replicates the ~675M ViT encoder across GPUs (data-parallel mode)
#   to avoid tensor-parallel communication overhead during image processing.
# Tool Use: Hermes-style tool calling syntax supported via tool-call-parser: hermes

model: Qwen/Qwen2.5-VL-72B-Instruct
tensor-parallel-size: 4
max-model-len: 128000
# Native context: 128,000 tokens (full native context retained).
# Reduce to 65536 if maximising batch concurrency under heavy multimodal loads.
gpu-memory-utilization: 0.90
dtype: bfloat16

# Vision encoder parallelism (data-parallel across TP workers)
mm-encoder-tp-mode: data

# Multimodal limits: cap concurrent images/videos per prompt to prevent unexpected OOMs
limit-mm-per-prompt: '{"image": 2, "video": 0}'

# Tool calling
enable-auto-tool-choice: true
tool-call-parser: hermes

# Prefix caching
enable-prefix-caching: true
